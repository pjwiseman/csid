  - name: Honeydew (yellow skin)
    group: fruits
    status: good
    notes: Golden/yellow-skin honeydew. English Table 1 (≤1 g sucrose and starch / 100 g). AFCD R3 peeled raw 1.0 g sucrose, 0 g starch, 0 g maltose. White-skin honeydew is 3.9 g sucrose — listed separately as avoid. USDA ~2.5 g/100 g is a US blend, not this cultivar.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
