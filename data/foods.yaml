# CSID food lists — Phase 2 Australian SSRD expansion
# Australia primary: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
# Elimination baseline (Step 1): https://www.idealnutrition.com.au/csid-how-to-manage-sucrase-isomaltase-deficiency/
# Individual tolerance varies; use portion testing to personalise.

meta:
  source: "English — What Can I Eat With Sucrase-Isomaltase Deficiency in Australia (AUSNUT 2023 / AFCD)"
  source_url: "https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia"
  phase: "Phase 2 — Australian SSRD expansion (low sucrose and starch ≤1 g/100 g, plus portion testing)"
  note: >
    Phase 2 uses Australian food-composition data (English et al., AUSNUT 2023 framework;
    sucrose/maltose/starch verified from FSANZ AFCD Release 3). Foods with ≤1 g sucrose AND
    ≤1 g starch per 100 g are treated as allow. English also requires portion load: if the
    amount typically eaten provides ≤1 g sucrose and ≤1 g starch (e.g. garlic clove, ~1 stock
    cube), treat as allow with the defined portion in notes. Table 3–5 foods above the
    per-100 g low threshold stay avoid unless a defined portion is being tested. Ideal
    Nutrition Step 1 elimination remains the historical baseline; overseas CSID lists often
    differ because they use US composition. Individual enzyme activity, meal load, and
    FODMAPs still matter.
  research_sources:
    - title: English — What can I eat with SID in Australia (primary for Australia, Phase 2)
      url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      use: AUSNUT 2023 traffic-light sucrose/starch; AU cultivar lists; 1 g sucrose portions
    - title: English, Mueller, Radd-Vagenas — SSRD Dataset Australia (Bond University)
      url: https://research.bond.edu.au/en/datasets/ssrd-dataset-australia/
      use: Full traffic-light dataset extracted from AUSNUT 2023; paper Frontline Gastroenterology 2026
    - title: FSANZ Australian Food Composition Database (AFCD) Release 3
      url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
      use: Per-100 g sucrose, maltose, and starch for Australian foods (AUSNUT 2023 published survey file reports starch and total sugars, not sucrose)
    - title: FSANZ AUSNUT 2023
      url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/ausnut/data-files
      use: Australian survey food list; starch and total sugars per 100 g
    - title: Ideal Nutrition — CSID management guide (Step 1 elimination baseline)
      url: https://www.idealnutrition.com.au/csid-how-to-manage-sucrase-isomaltase-deficiency/
      use: Strict disaccharide-free elimination lists; reintroduction protocol
    - title: CSID Cares — Choosing Your Foods (Sucraid manufacturer)
      url: https://www.csidcares.org/treatment/diet/
      use: Tiered fruit/vegetable/dairy tolerance (most / some / few); food diary guidance; links to food composition tables
    - title: ANTHC CSID Store-Bought Food Guide (PDF)
      url: https://anthc.org/wp-content/uploads/2025/06/CSID-Store-Bought-Food-Guide.pdf
      use: Usually vs least tolerated foods; label-check tips; summer squash, cauliflower, plain yoghurt
    - title: ANTHC CSID Educational Booklet (PDF)
      url: https://anthc.org/wp-content/uploads/2025/06/CSID-Educational-Booklet.pdf
      use: Sucrose/starch overview; tolerated food tiers; individual variation
    - title: CSID Made Simple — food list
      url: https://csidmadesimple.com/csid-food-list/
      use: Vegetables/dairy tiered tolerance (most / some / few); summer squash and cauliflower
    - title: CSIDinfo.com — dairy composition table
      url: http://www.csidinfo.com/dairy.htm
      use: Sucrose, starch, and lactose grams per serving; Greek yoghurt (unsweetened)
    - title: Leeds Teaching Hospitals NHS Trust — CSID dietary advice
      url: https://www.leedsth.nhs.uk/patients/resources/dietary-advice-for-congenital-sucrose-isomaltase-deficiency/
      use: NHS clinical guidance; cauliflower/courgette substitutes; Greek yoghurt in cooking
    - title: Jenna Volpe RDN — low sucrose foods list
      url: https://wholeisticliving.com/2023/01/16/low-sucrose-foods-list/
      use: Dietitian-curated low-sucrose vegetables including zucchini and cauliflower

