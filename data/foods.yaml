  # --- Fruits (bad) ---
  - name: Apple
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: Above the ≤1 g/100 g low band. AFCD R3 Fuji unpeeled 1.1 g sucrose, 0 g starch. English Table 3 — about ½ medium Fuji (~75 g) for ~1 g sucrose if testing portions.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
  - name: Apricot
    group: fruits
    status: bad
    concerns: [sucrose]
  - name: Banana
    group: fruits
    status: bad
    concerns: [sucrose]
  - name: Date
    group: fruits
    status: bad
    concerns: [sucrose, starch]
    notes: Not on English Table 1. AFCD R3 dried 0 g sucrose, 1.3 g starch. Table 5 lists a 30 g dried date serve for fibre if starch at that portion is tolerated.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
  - name: Grapefruit
    group: fruits
    status: bad
    concerns: [sucrose]
  - name: Mango
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: AFCD R3 peeled raw 8.4 g sucrose, 0.5 g starch. English Table 3 — about 1 tbsp diced for ~1 g sucrose.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
  - name: Mandarin
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: Includes clementines and tangerines. Not on English Table 1. CSID Cares — few CSID patients tolerate mandarin oranges.
    sources:
      - title: CSID Cares — Choosing Your Foods
        url: https://www.csidcares.org/treatment/diet/
  - name: Melon
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: Unspecified melon. Yellow-skin honeydew is allow; white-skin honeydew, rockmelon, and watermelon are not Table 1.
  - name: Honeydew (white skin)
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: AFCD R3 peeled raw 3.9 g sucrose, 0 g starch. Generic “honey dew, peeled” 2.3 g sucrose. Only yellow-skin honeydew meets English ≤1 g/100 g. USDA ~2.5 g/100 g is a US figure, not AU yellow-skin.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
  - name: Rockmelon
    group: fruits
    status: bad
    concerns: [sucrose]
    notes: Cantaloupe. Not on English Table 1. AFCD R3 peeled raw 2.0 g sucrose, 0 g starch (moderate/higher boundary). CSID Cares — few patients.
    sources:
