  # --- Dairy (good) ---
  - name: Hard cheese (e.g. cheddar)
    group: dairy
    status: good
    notes: Low lactose; often tolerated if lactose is not an issue
  - name: Haloumi
    group: dairy
    status: good
    notes: Semi-hard brined cheese; low lactose and negligible sucrose/starch. Plain only — check labels for added milk solids or starch in flavoured or processed products.
    sources:
      - title: ANTHC CSID Store-Bought Food Guide
        url: https://anthc.org/wp-content/uploads/2025/06/CSID-Store-Bought-Food-Guide.pdf
      - title: CSIDinfo.com — dairy table (feta, similar brined cheese)
        url: http://www.csidinfo.com/dairy.htm
  - name: Unsweetened soy milk
    group: dairy
    status: good
  - name: Unsweetened nut milk
    group: dairy
    status: good
  - name: Unsweetened lactose-free milk
    group: dairy
    status: good
  - name: Greek yoghurt (unsweetened)
    group: dairy
    status: good
    notes: Plain only; check labels for added sugar or starch thickeners. Contains lactose — test if lactose-sensitive.
    sources:
      - title: ANTHC CSID Store-Bought Food Guide
        url: https://anthc.org/wp-content/uploads/2025/06/CSID-Store-Bought-Food-Guide.pdf
      - title: CSIDinfo.com — dairy table
        url: http://www.csidinfo.com/dairy.htm
      - title: Leeds NHS — CSID dietary advice
        url: https://www.leedsth.nhs.uk/patients/resources/dietary-advice-for-congenital-sucrose-isomaltase-deficiency/

  # --- Dairy (bad) ---
  - name: Flavoured yoghurt
    group: dairy
    status: bad
    concerns: [lactose, sucrose]
    notes: Added sucrose; contrast with plain unsweetened Greek yoghurt
  - name: Milk and milk products (general)
    group: dairy
    status: bad
    concerns: [lactose, sucrose]
    notes: Avoid except hard cheese, plain unsweetened Greek yoghurt, and unsweetened lactose-free or plant milks listed above

