  - name: Strawberry
    group: fruits
    status: good
    notes: Fresh or unsweetened frozen. English Table 1. AFCD R3 raw 0 g sucrose, 0.1 g starch. Canned in syrup is higher sucrose — avoid. Ideal Nutrition Step 1 listed strawberry as avoid.
