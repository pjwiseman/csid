  - name: Pear
    group: fruits
    status: good
    notes: Green-skin, Packham, William Bartlett, nashi, and canned-in-juice. English Table 1. AFCD R3 sucrose 0.5–0.8 g/100 g, starch ≤0.2 g. Brown-skin pear is 2.4 g sucrose — treat as higher, not this allow entry. Ideal Nutrition Step 1 listed pear as avoid.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
  - name: Raspberry
    group: fruits
    status: good
    notes: Fresh or unsweetened frozen. English Table 1. AFCD R3 raw 0.5 g sucrose, 0.2 g starch. Canned in syrup is higher sucrose — avoid. Ideal Nutrition Step 1 listed raspberry as avoid.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: FSANZ AFCD Release 3
