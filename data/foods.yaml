  # --- Sweets and lollies (good) ---
  - name: Jila Spearmint No Sugar Mints
    group: sweets
    status: good
    notes: Sugar-free; sweetened with sorbitol and steviol glycosides (stevia). No sucrose, maltose, or starch. Excess sugar alcohols can cause gas/diarrhoea in anyone — moderation. Check the tin; formulation can change.
    sources:
      - title: CSIDinfo.com — sweeteners (sorbitol)
        url: https://csidinfo.com/sweetener.htm
      - title: CSID Cares — Sugars and Sugar Substitutes
        url: https://www.csidcares.org/treatment/sugars/
      - title: Officeworks — Jila Sugar Free Mints Spearmint ingredients
        url: https://www.officeworks.com.au/shop/officeworks/p/jila-sugar-free-mints-spearmint-34g-le87300

  - name: Jols 99% Sugar Free Fruit Pastilles
    group: sweets
    status: good
    notes: Sugar-free pastilles sweetened with sorbitol, maltitol, aspartame, and acesulfame-K. Not sucrose/starch confectionery, but maltitol is only for some CSID phenotypes (CSIDinfo); polyols may cause GI symptoms in excess. Trace fruit-juice concentrate (~1%) including orange — negligible for most, but retest if sensitive. Check label.
    sources:
      - title: CSIDinfo.com — sweeteners (sorbitol, maltitol)
        url: https://csidinfo.com/sweetener.htm
      - title: CSID Cares — Sugars and Sugar Substitutes
        url: https://www.csidcares.org/treatment/sugars/
      - title: Woolworths — Jols Sugar Free Pastilles Three Fruits ingredients
        url: https://www.woolworths.com.au/shop/productdetails/231545/jols-sugar-free-pastilles-three-fruits

  - name: Double D Butter Lollies (sugar free)
    group: sweets
    status: good
    notes: Sugar-free butter candy (~89% isomalt) with stevia; no sucrose. Isomalt is a polyol tolerated by some CSID phenotypes (CSIDinfo B/C; CSID Cares — sugar alcohols for some). Not sucrose — slow incomplete α-glucosidase hydrolysis; excess polyols can cause gas/diarrhoea in anyone. Contains butter and cream — test if lactose-sensitive. Moderation (≈3.5 g isomalt per drop). Confirm sugar-free pack.
    sources:
      - title: CSIDinfo.com — sweeteners (isomalt)
        url: https://csidinfo.com/sweetener.htm
      - title: CSID Cares — Sugars and Sugar Substitutes
        url: https://www.csidcares.org/treatment/sugars/
      - title: Double D — Sugar Free Butter Candy ingredients
        url: https://www.doubledproducts.com.au/product/double-d-sugar-free-butter-candy-70g/

  # --- Other ---
  - name: Sea salt
    group: other
    status: good
    notes: Pure sodium chloride; no sucrose, lactose, maltose, or starch. Table salt is equivalent.
    sources:
      - title: CSID Cares — Choosing Your Foods
        url: https://www.csidcares.org/treatment/diet/
  - name: Flavour enhancer 621 (MSG)
    group: other
    status: good
    notes: Monosodium glutamate (INS 621); not a disaccharide or starch. Listed as flavour enhancer on AU/NZ labels.
  - name: Spices and herbs
    group: other
    status: good
    notes: Enjoy freely
  - name: Mustard (wholegrain, Dijon)
    group: other
    status: good
    notes: Plain mustard only; check labels for added sugar, malt vinegar, or wheat flour (some brands).
  - name: Gluten-free soy sauce
    group: other
    status: good
    notes: Wheat-free tamari-style; avoids maltose/starch from wheat in regular soy sauce. Check for added sugar.
    sources:
      - title: CSID Cares — Reading Food Labels
        url: https://www.csidcares.org/treatment/reading-food-labels/
  - name: Vegemite
    group: other
    status: good
    notes: >-
      AFCD R3 “spread, yeast, vegemite” — 0 g sucrose, 1.6 g maltose, 9.3 g starch
      per 100 g (starch above the ≤1 g/100 g low band). A typical ~5 g scrape is
      ~0.5 g starch and ~0.08 g maltose; about 11 g would reach 1 g starch. Use
      thinly. Contains malt extract and yeast from barley/wheat unless labelled
      gluten-free; check the jar. Ideal Nutrition Step 1 does not list yeast
      extract; Phase 2 allow is portion-based from AFCD.
    sources:
      - title: FSANZ AFCD Release 3 — spread, yeast, vegemite
        url: https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd/data-files
      - title: Weight Loss Resources AU — AFCD Vegemite nutrient profile
        url: https://www.weightloss.com.au/food-nutrition-tables/food/spread-yeast-vegemite-f008785/
      - title: Ideal Nutrition — CSID management guide
        url: https://www.idealnutrition.com.au/csid-how-to-manage-sucrase-isomaltase-deficiency/
  - name: Red wine (dry)
    group: other
    status: good
    notes: >-
      Dry table red for stew. USDA table red wine 0.62 g total sugars and 2.61 g
      carbohydrate per 100 g, 0 g added sugars; residual sugar is glucose/fructose
      (allow sweeteners), sucrose after fermentation is typically ~0. Starch 0.
      A cup in a shared stew is a small per-serve load. Avoid sweet, fortified,
      or “cooking wine” with added sugar. Alcohol is separate from CSID carbs.
    sources:
      - title: USDA FoodData Central — alcoholic beverage, wine, table, red
        url: https://fdc.nal.usda.gov/food-details/173190/nutrients
      - title: USDA added-sugars database — table red wine 0 g added sugars
        url: https://www.govinfo.gov/content/pkg/GOVPUB-A77-PURL-LPS86777/pdf/GOVPUB-A77-PURL-LPS86777.pdf
  - name: Worcestershire sauce
    group: other
    status: bad
    concerns: [sucrose, maltose]
    notes: >-
      AU Lea & Perrins — malt vinegar (barley), molasses, and sugar; 18.8 g sugars
      per 100 mL (~0.9 g sugars per 5 mL teaspoon). Above the 1 g sucrose/100 g
      low band; malt vinegar is a maltose/grain concern. Ideal Nutrition Step 1
      avoids added sugars. Skip in stew, or use a homemade mix of spirit vinegar,
      anchovy, tamarind, garlic, and spices without sugar or molasses.
    sources:
      - title: Lea & Perrins Worcestershire Sauce (AU) ingredients and NIP
        url: https://www.mocofoodservices.com.au/globalassets/moco---catalog-image/pantry/salt--pepper/32387-42637_2l-lp-sauce.pdf
      - title: Ideal Nutrition — CSID management guide
        url: https://www.idealnutrition.com.au/csid-how-to-manage-sucrase-isomaltase-deficiency/
      - title: CSID Cares — Reading Food Labels
        url: https://www.csidcares.org/treatment/reading-food-labels/
