  # --- Meat (good) ---
  - name: Lamb
    group: meat
    status: good
  - name: Beef
    group: meat
    status: good
  - name: Beef broth (plain homemade)
    group: meat
    status: good
    notes: >-
      Homemade from beef bones/meat, water, salt, and allowed herbs/veg — English
      treats plain meat as negligible sucrose and starch. USDA home-prepared beef
      stock ~1.2 g carbohydrate and 0.54 g sugars per 100 g (sucrose/starch not
      reported; likely from simmered veg). Commercial cubes/powder: see Beef stock
      cubes and powder (allow at directed cooking amounts). Carton stocks still
      need a label check for sugar, maltodextrin, starch, or flour.
    sources:
      - title: English — SID in Australia
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
      - title: USDA FoodData Central — soup, stock, beef, home-prepared
        url: https://fdc.nal.usda.gov/food-details/172883/nutrients
      - title: CSID Cares — Reading Food Labels
        url: https://www.csidcares.org/treatment/reading-food-labels/
  - name: Beef stock cubes and powder
    group: meat
    status: good
    notes: >-
      AFCD R3 “Stock, dry powder or cube” 4.1 g sucrose, 18.2 g starch per 100 g
      dry — both English higher (>2 g). Apply English garlic principle: classify
      the amount eaten, not 100 g of concentrate. One cube ≈5 g dry → ~0.2 g
      sucrose, ~0.9 g starch (both ≤1 g). Starch-limiting ~1 g portion ≈5.5 g dry
      (~1 cube). Massel powder as directed (1 heaped tsp / 1 L) is lower still when
      prepared. Allow at directed/cooking amounts; liberal multi-tsp powder in one
      personal serve can exceed. Brands vary — label-check if using more than
      ~1 cube or 1 tsp.
    sources:
      - title: English — SID in Australia (portion vs per 100 g)
        url: https://www.drcarolynenglish.com/post/what-can-i-eat-with-sucrase-isomaltase-deficiency-in-australia
